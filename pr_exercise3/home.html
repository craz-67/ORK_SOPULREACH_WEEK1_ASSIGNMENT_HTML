<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Cinzel:wght@400..900&family=Cookie&family=Coral+Pixels&family=Fragment+Mono:ital@0;1&family=Gloock&family=Henny+Penny&family=Instrument+Serif:ital@0;1&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Luxurious+Script&family=Martian+Mono:wght@100..800&family=Monsieur+La+Doulaise&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif+Display:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <title>crazExercise3</title>
    <style>
        #bar a:hover{
            color: red;
        }
        #bar a{
            color: black;
        }
        #bleu{
            transform: scale(0.2);
        }
        #bleu:hover{
            transform: scale(0.25);
        }
        #banner img{
            z-index: 2;
        }
        #banner p{
            z-index: 1;
        }
        #button{
            transition: transform 0.3s ease; 
        }
        #button:hover{
            transform: scale(1.1);
        }
        #button a{
            text-decoration: none;
        }
        #banner{
            animation: slideUp 1.5s ease-out;
        }
        @keyframes slideUp {
            from{
                transform: translateY(500px);
                opacity: 0;
            }
            to{
                transform: translateY(0);
                opacity: 1;
            }
        }
        body {
            margin: 0;
        }
    </style>
</head>
<body>
    <div>
        <header>
                <nav id="bar" style="display: flex; gap: 300px; justify-content: center; align-items: center; font-size: 20px;  font-family: 'Alegreya' ,serif; background-color: rgba(0, 0, 0, 0.3); height: 60px">
                <a href="./home.html" style="text-decoration: none; color:darkred">Home</a>
                <a href="./about.html" style="text-decoration: none;">About us</a>
                <a href="./service.html" style="text-decoration: none;">Our services</a>
                <a href="./contact.html" style="text-decoration: none;">Contact</a>
            </nav>
        </header>
        <div id="banner" style="font-family:  'Coral Pixels', serif;display: flex; flex-direction: column; align-items: center;">
            <p style="position: relative; top: 300px; text-align: center; font-size: 50px;">Welcome to our fragrance site</p>
            <img id="bleu" src="../../image/bleu.png" alt="bleu" style="position: relative; left: 390px; bottom: 50px;transition: transform 0.3s ease;">
            <p style="font-family: 'Luxurious Script', cursive; font-size: 30px; position: relative; bottom:280px">Establish in 2026</p>
            <div id="button" style="display: flex; justify-content: center; align-items: center; border: 1px solid black;box-shadow: 0 10px 30px rgba(0,0,0,0.25); width: 150px; height: 40px; border-radius: 40px;">
                <a href="./about.html" style="font-family:'Alegreya', serif; font-size: 18px;font-style: italic;">Displore</a>
            </div>
        </div>
    </div>
</body>
</html>
